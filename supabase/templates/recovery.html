<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your lalista password</title>
  </head>
  <body
    style="margin: 0; padding: 24px 0; background-color: #fdfaf6; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #1a1208;"
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #fdfaf6;"
    >
      <tr>
        <td align="center" style="padding: 0 16px;">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 480px; background-color: #ffffff; border-radius: 8px; padding: 24px;"
          >
            <tr>
              <td align="center" style="padding-bottom: 16px;">
                <img
                  src="https://lalista.store/lalista-email-logo.png"
                  width="120"
                  height="40"
                  alt="lalista"
                  style="display: block; border: 0;"
                />
              </td>
            </tr>
            <tr>
              <td>
                <h1
                  style="margin: 0 0 16px; font-family: 'Fraunces', Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.2; color: #1a1208;"
                >
                  Reset your lalista password
                </h1>
                <p
                  style="margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: #1a1208;"
                >
                  Tap the button to set a new password. If you didn’t ask for
                  this, you can ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom: 8px;">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="display: inline-block; padding: 14px 24px; background-color: #d4603a; color: #ffffff; text-decoration: none; border-radius: 12px; font-size: 15px; font-weight: 600;"
                >
                  Set new password
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding-top: 24px;">
                <p
                  style="margin: 0; font-size: 12px; line-height: 1.5; color: #888888; text-align: center;"
                >
                  lalista — your bilingual grocery list.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
