# CI in two tiers (the devshop's template; copy to .github/workflows/ci.yml). Plain CI, no LLM jobs.
#   fast: the PR title check (scripts/pr-title-check.py: a Conventional Commit type), then static
#         checks and unit tests, scripts/check-fast.sh "$BASE" (secret scan, spec check with
#         acceptance→test, the project contract check, lint where the project has it, unit tests);
#         its template is runtime/templates/check-fast.sh.
#   slow: end-to-end tests, scripts/check-slow.sh; runs only after fast passes.
# What each tier runs lives in those two scripts, so this file stays the same for every stack. A
# project with no slow tests yet keeps a check-slow.sh that says so and exits 0. Make `fast` and
# `slow` the required checks on main. Never give either a job-level `if` or `continue-on-error`:
# GitHub counts a skipped required job as passed. A deploy job needs both.
# On main, the deploy and the merged PR's deploy comment (specs/deploy-and-metrics-comments.md in the
# devshop): `announce` comments "Merged" when the run starts; `deploy`, after both tiers, comments
# "Deploying", runs scripts/deploy.sh when the project has one, then "Live in production" or "failed";
# `report`, after all of them, ends the comment in a final state whatever happened (checks failed,
# cancelled, superseded by a newer merge). The comment is scripts/deploy-comment.mjs, the devshop's
# copy, kept unchanged. The comment jobs and steps never fail or hold up the deploy.
# Checked by the devshop's ci-tiers-check.py at session start.
#
# lalista: the stack's setup (pnpm, Node, the local Supabase stack, Playwright's browsers) is in the
# "stack tool installs" steps below; what each tier checks is in scripts/check-fast.sh and
# scripts/check-slow.sh (specs/devshop-v3.md). `slow` runs on every PR and on main, and the deploy
# waits for it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The fast tier builds the app. Its Supabase values are the local stack's (GitHub Variables,
    # public); production's live only in the `production` environment, read by `deploy`.
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0 # the secret scan and other checks read the commits since the base
          persist-credentials: false

      # --- Stack tool installs ---
      - uses: pnpm/action-setup@v3
        # No `version:`: action-setup reads pnpm's version from package.json#packageManager.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # GitHub's release downloads answer 504 now and then (PR #15's first two runs): retry.
          curl -fsSLo "$RUNNER_TEMP/$tarball" --retry 5 --retry-delay 5 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Project setup
        run: if [ -x scripts/setup.sh ]; then scripts/setup.sh; fi

      # The PR's title, or on a push the head commit's first line (the squash merge makes it from the
      # title), starts with a Conventional Commit type. Passed through env, never interpolated.
      - name: PR title (a Conventional Commit type)
        env:
          TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: scripts/pr-title-check.py "$(head -n 1 <<<"$TITLE")"

      - name: Fast tier (secret scan, spec check, contract check, lint, unit tests)
        env:
          # PR: everything since the base; push to main: everything since the previous tip.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check-fast.sh "$BASE"

  # The slow tier: a real Supabase stack inside the runner (Docker is native on GitHub's runners),
  # seeded, with the add-item edge function served locally; then scripts/check-slow.sh. A run takes
  # 7-8 minutes (PR #15); the 45-minute timeout is a ceiling kept from the v1 notes (specs/devshop-v3.md).
  slow:
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # --- Stack tool installs ---
      - uses: pnpm/action-setup@v3
        # No `version:`: action-setup reads pnpm's version from package.json#packageManager.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      # Cache 1 of 3: pnpm store (speeds up install on repeat PR pushes).
      # Cache 2 of 3: Turborepo outputs (reuses unit-test + typecheck hashes).
      - name: Cache turbo outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-

      # Cache 3 of 3: Playwright browsers. Key hashes the workspace lockfile
      # so a Playwright version bump invalidates the cache cleanly.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Project setup
        run: if [ -x scripts/setup.sh ]; then scripts/setup.sh; fi

      - name: Install Playwright system deps (always)
        # System libraries (libwoff2dec, libgstreamer, etc.) live in /usr/lib via
        # apt-get and are NOT preserved by the Playwright browser cache. Different
        # GitHub-hosted runner images have slightly different baseline packages —
        # some have libwoff2dec baked in, some don't. Run `install-deps`
        # unconditionally so WebKit can launch regardless of which runner we land
        # on. (Idempotent + fast when packages are already present.)
        run: pnpm --filter @lalista/web exec playwright install-deps chromium webkit

      - name: Install Playwright browsers (chromium + webkit)
        # Both are needed: `desktop` project uses Chromium, `mobile` project
        # inherits `devices['iPhone SE']` which defaults to WebKit. Without
        # WebKit, every mobile test fails with "Executable doesn't exist at
        # ...webkit-XXXX/pw_run.sh" — the prior install-chromium-only pattern
        # cost us an entire CI round to surface.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @lalista/web exec playwright install chromium webkit

      # Supabase CLI + local stack, at the same pin as every workflow. `latest`
      # broke the type-drift check when a newer CLI started writing
      # `ComputedFields` into the generated types.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Start local Supabase
        run: |
          supabase start --ignore-health-check
          # Export the local stack's keys + URL into GITHUB_ENV so downstream
          # steps can consume them without parsing logs in every step.
          # `supabase status -o env` emits `KEY="value"` lines; GitHub Actions'
          # $GITHUB_ENV parser preserves the literal double quotes, so the
          # stored env var becomes `"value"` (with quote chars). Next.js
          # middleware then passes the quoted string to `new URL(...)` which
          # throws "Invalid supabaseUrl". Strip the surrounding quotes before
          # export so every downstream consumer gets a plain value.
          supabase status -o env | sed -E 's/="(.*)"$/=\1/' >> $GITHUB_ENV

      - name: Verify edge runtime healthy (retry once on 5xx)
        # The supabase_edge_runtime_workspace container occasionally fails
        # health-check on cold-start in GH-Actions runners — `supabase start`
        # reports the stack ready while the edge runtime is still booting (or
        # crashed). Without this gate the failure surfaces mid-test as 502
        # responses from `invokeAddItem` ("Couldn't add. Check your connection"
        # toast), which makes core-flows / add-new / force-create-race / item-
        # detail flake on edge-runtime startup, not on test logic.
        #
        # Probe: POST FUNCTIONS_URL/add-item with empty body. The function
        # auth-checks first and returns 401 — any 4xx confirms the runtime
        # is alive. 5xx / 000 (timeout) means the runtime hasn't come up.
        # On unhealthy: stop + restart the stack once, re-export env, retry.
        # Keeps the slow-job's 502-flake budget at zero.
        run: |
          probe_edge_runtime() {
            curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 10 \
              -X POST "$FUNCTIONS_URL/add-item" \
              -H 'Content-Type: application/json' \
              -d '{}' 2>/dev/null || echo '000'
          }
          code=$(probe_edge_runtime)
          case "$code" in
            4*)
              echo "✓ Edge runtime healthy (probe returned HTTP $code)"
              ;;
            *)
              echo "::warning::Edge runtime probe returned HTTP $code — restarting Supabase stack once"
              supabase stop || true
              supabase start --ignore-health-check
              supabase status -o env | sed -E 's/="(.*)"$/=\1/' >> $GITHUB_ENV
              # Re-source FUNCTIONS_URL for the second probe in this step
              # (the `>> $GITHUB_ENV` only affects subsequent steps).
              FUNCTIONS_URL=$(supabase status -o env | grep '^API_URL=' | sed -E 's/="?(.*)"?$/\1/' | tr -d '"')/functions/v1
              sleep 3
              code=$(probe_edge_runtime)
              case "$code" in
                4*)
                  echo "✓ Edge runtime healthy after restart (probe returned HTTP $code)"
                  ;;
                *)
                  echo "::error::Edge runtime still unhealthy after restart (HTTP $code)"
                  echo "::error::Inspect supabase logs above for the supabase_edge_runtime_workspace container."
                  exit 1
                  ;;
              esac
              ;;
          esac

      - name: Mask service-role key
        # Defense in depth: `supabase status -o env` writes the service-role
        # key into $GITHUB_ENV; subsequent `echo` calls could leak it in logs.
        # Add an explicit mask so it never appears in step output even if a
        # future step echoes it.
        run: |
          if [ -n "${SERVICE_ROLE_KEY:-}" ]; then
            echo "::add-mask::$SERVICE_ROLE_KEY"
          fi
          if [ -n "${ANON_KEY:-}" ]; then
            echo "::add-mask::$ANON_KEY"
          fi

      - name: Verify SERVICE_ROLE_KEY is local-stack default (defense-in-depth)
        # Catches a misconfiguration where SERVICE_ROLE_KEY in CI ever resolves
        # to the prod service-role JWT. Decode the JWT payload (segment 2) and
        # assert the issuer is `supabase-demo` (the published local-stack
        # default) + role is `service_role`. Under normal operation
        # `supabase status -o env` populates this from the local stack the
        # runner just spun up, so the check always passes; what it catches is
        # a future drift (someone wires `${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}`
        # into the env, OR the workflow gets edited in a way that pulls in
        # the prod key). Aborts BEFORE any step that could expose the key
        # via logs or inadvertent network calls.
        run: |
          if [ -z "${SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SERVICE_ROLE_KEY not set — supabase status probably failed"
            exit 1
          fi
          payload=$(echo "$SERVICE_ROLE_KEY" | cut -d'.' -f2)
          # Pad base64url to a multiple of 4 chars before decode.
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          padded="$payload$(printf '=%.0s' $(seq 1 $pad))"
          decoded=$(echo "$padded" | tr '_-' '/+' | base64 -d 2>/dev/null || true)
          iss=$(echo "$decoded" | jq -r '.iss // empty')
          role=$(echo "$decoded" | jq -r '.role // empty')
          if [ "$iss" != "supabase-demo" ] || [ "$role" != "service_role" ]; then
            echo "::error::SERVICE_ROLE_KEY is NOT the local-stack default."
            echo "::error::Decoded iss='$iss' role='$role' (expected 'supabase-demo' + 'service_role')."
            echo "::error::Aborting before this could leak prod admin credentials."
            exit 1
          fi
          echo "✓ SERVICE_ROLE_KEY verified as local-stack default (iss=$iss role=$role)"

      - name: Load seed fixtures
        run: |
          # `supabase db reset` already applies migrations + seed.sql; this
          # step is a no-op safeguard if the reset was skipped (e.g. because
          # supabase start retained a warm volume between cache resumes).
          supabase db reset --no-backup || true

      # No explicit `supabase functions deploy` step — `supabase start`
      # with `[edge_runtime] enabled = true` in `supabase/config.toml`
      # auto-serves every subdirectory of `supabase/functions/` on the
      # local stack at `${FUNCTIONS_URL}/<name>` (per `per_worker` policy,
      # with hot reload on file change). A `functions deploy` call without
      # a `--project-ref` does NOT target local — it tries to push to the
      # cloud and fails with "Access token not provided" (first slow-job
      # run surfaced this). The edge-function code already calls
      # `supabase.auth.getUser()` internally so JWT validation is covered
      # regardless of edge-runtime `verify_jwt` configuration.

      - name: Slow tier (integration tests, database checks, end-to-end tests)
        env:
          # The QA key, never production's: the local stack must not burn production billing.
          # See CLAUDE.md § Env Var Naming.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_QA }}
        run: scripts/check-slow.sh

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # Comments "Merged" on the merged PR as soon as the run on main starts (its deploy comment).
  announce:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # the deploy comment
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Tell the merged PR it merged
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/deploy-comment.mjs merged

  # Production deploy: main only, after both tiers passed on this commit. The deploy itself is the
  # project's scripts/deploy.sh (setup by scripts/setup.sh, as in the tiers); with none, nothing is
  # deployed and the comment says "this project has no deploy step yet". scripts/deploy.sh writes, to
  # $GITHUB_OUTPUT, what the comment reads:
  #   url=<the live https URL>  version=<the new version>  previous_version=<the version it replaced>
  #   rollback=<the line that undoes it>  deployed=yes (once the new version is uploaded; absent before)
  #   site_url=<the site's own https origin>  site_smoke=passed|failed|skipped (its domain check)
  # A project edits only the lines marked "---": its tool installs, and its deploy settings and secrets.
  # Its secrets live in the `production` environment, whose deployment branch rule allows `main` alone.
  # How to write deploy.sh for a stack is in that stack's home (runtime/stacks/ in the devshop).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fast, slow]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the deploy comment
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs: # for `report`, when this job's own comment step couldn't write
      url: ${{ steps.deploy.outputs.url }}
      version: ${{ steps.deploy.outputs.version }}
      previous_version: ${{ steps.deploy.outputs.previous_version }}
      rollback: ${{ steps.deploy.outputs.rollback }}
      site_url: ${{ steps.deploy.outputs.site_url }}
      site_smoke: ${{ steps.deploy.outputs.site_smoke }}
      none: ${{ steps.deploy.outputs.none }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      # The comment reports the deploy, it is not part of it: a comment GitHub refuses or a slow API
      # shows as a failed step but never fails or holds up the deploy. No deploy secret in its env.
      - name: Tell the merged PR it is deploying
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/deploy-comment.mjs deploying

      - uses: pnpm/action-setup@v3
        # No `version:`: action-setup reads pnpm's version from package.json#packageManager.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Project setup
        run: if [ -x scripts/setup.sh ]; then scripts/setup.sh; fi

      - name: Deploy (scripts/deploy.sh)
        id: deploy
        env:
          BUILD_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROD_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PROD_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SITE_URL: ${{ vars.SITE_URL }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -x scripts/deploy.sh ]; then
            scripts/deploy.sh
          else
            echo "No scripts/deploy.sh: nothing deployed."
            echo "none=yes" >>"$GITHUB_OUTPUT"
          fi

      - name: Tell the merged PR it is live
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          URL: ${{ steps.deploy.outputs.url }}
          VERSION: ${{ steps.deploy.outputs.version }}
          PREVIOUS: ${{ steps.deploy.outputs.previous_version }}
          ROLLBACK: ${{ steps.deploy.outputs.rollback }}
          SITE_URL: ${{ steps.deploy.outputs.site_url }}
          SITE_SMOKE: ${{ steps.deploy.outputs.site_smoke }}
          NONE: ${{ steps.deploy.outputs.none }}
        run: node scripts/deploy-comment.mjs deployed

      - name: Tell the merged PR the deploy failed
        if: failure() || cancelled()
        continue-on-error: true
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREVIOUS: ${{ steps.deploy.outputs.previous_version }}
          ROLLBACK: ${{ steps.deploy.outputs.rollback }}
          DEPLOYED: ${{ steps.deploy.outputs.deployed }}
          SITE_URL: ${{ steps.deploy.outputs.site_url }}
          SITE_SMOKE: ${{ steps.deploy.outputs.site_smoke }}
        run: node scripts/deploy-comment.mjs failed

  # Ends the deploy comment in a final state whatever happened: checks failed or cancelled on main, the
  # deploy superseded by a newer merge's, cancelled, or this job's own comment write lost.
  report:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fast, slow, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # the deploy comment
      actions: read # to find a newer run on main
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: End the merged PR's deploy comment in a final state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAST: ${{ needs.fast.result }}
          SLOW: ${{ needs.slow.result }}
          DEPLOY: ${{ needs.deploy.result }}
          URL: ${{ needs.deploy.outputs.url }}
          VERSION: ${{ needs.deploy.outputs.version }}
          PREVIOUS: ${{ needs.deploy.outputs.previous_version }}
          ROLLBACK: ${{ needs.deploy.outputs.rollback }}
          SITE_URL: ${{ needs.deploy.outputs.site_url }}
          SITE_SMOKE: ${{ needs.deploy.outputs.site_smoke }}
          NONE: ${{ needs.deploy.outputs.none }}
        run: node scripts/deploy-comment.mjs report
